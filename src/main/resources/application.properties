spring.application.name=totalmed

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=totalmed;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS: origem permitida (front-end)
app.cors.allowed-origins=http://localhost:5173,http://localhost:8081
